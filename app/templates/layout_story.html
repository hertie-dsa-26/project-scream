<!doctype html>
<html>
<head>
    <title>{% block title %}SCREAM{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/story.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <aside>
        <a href="{{ url_for('home.home') }}" class="nav-brand">SCREAM</a>
        <a href="{{ url_for('home.home') }}">Home</a>
        <a href="{{ url_for('predictions.predictions') }}">Predictions</a>
        <a href="{{ url_for('explorer.explorer') }}">Explorer</a>
        <a href="{{ url_for('details.index') }}">Details</a>
    </aside>
    <div class="story-main">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
